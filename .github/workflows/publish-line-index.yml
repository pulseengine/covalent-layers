name: Publish the line index from the repository
# The committed `line-index/<line>.json` is the artifact of record (varve
# DD-027): the list of layers this realm has published on a line, kept here and
# never read from the registry, so a registry that HIDES a layer is noticed. A
# deposit proposes the updated document as a signed pull request (main requires
# one); merging it is the approval, and this job makes the registry serve it —
# again daily, so a lost index is re-created without anyone asking.
#
#   * the registry serves no index, or one that does not verify against this
#     realm's root, or an older one — PUBLISH;
#   * the registry serves exactly this document — nothing happens;
#   * the registry serves a newer or different index at this counter — REFUSE:
#     it was published out of band, and overwriting it would roll it back.

concurrency:
  group: publish-line-index
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths: ['line-index/*.json']
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Read the pins out of layer.toml
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          d = tomllib.load(open("layer.toml", "rb"))
          registry = d["realm"]["registry"]
          assert registry.startswith("oci://"), registry
          print(f"varve={d['varve']['version']}")
          print(f"repo={registry.removeprefix('oci://')}")
          print(f"realm={d['realm']['name']}")
          print(f"channel={d['realm']['channel']}")
          PY

      - name: Fetch and verify the pinned varve release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pins.outputs.varve }}
        run: |
          set -euo pipefail
          mkdir -p .varve/bin
          gh release download "$VER" --repo pulseengine/varve -D .varve \
            -p "varve-$VER-x86_64-unknown-linux-gnu.tar.gz" \
            -p 'varve-realms.toml' -p 'SHA256SUMS.txt' -p 'SHA256SUMS.txt.cosign.bundle'
          cd .varve
          cosign verify-blob \
            --certificate-identity-regexp 'https://github.com/pulseengine/varve/.github/workflows/release.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS.txt.cosign.bundle SHA256SUMS.txt
          sha256sum --ignore-missing -c SHA256SUMS.txt
          mkdir -p x && tar xzf "varve-$VER-x86_64-unknown-linux-gnu.tar.gz" -C x
          install -m 0755 x/varve bin/varve
          ./bin/varve --version | grep -q '^varve '

      - name: Make the registry serve what the repository says
        env:
          GH_TOKEN: ${{ github.token }}
          VARVE_COVALENT_KEY: ${{ secrets.VARVE_COVALENT_KEY }}
          REPO: ${{ steps.pins.outputs.repo }}
          REALM: ${{ steps.pins.outputs.realm }}
          CHANNEL: ${{ steps.pins.outputs.channel }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VARVE="$GITHUB_WORKSPACE/.varve/bin/varve"
          oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          oras repo tags "$REPO" > tags.txt
          FAILED=0
          # What a CONSUMER can read: `varve outdated` fetches the index through
          # the realm (registry + trust root from varve-realms.toml) and verifies
          # it. Its answer, not the raw blob, decides whether a published index
          # counts — an unverifiable one is treated as absent.
          served() {  # $1 = line, $2 = a layer of it; prints the verified index counter or nothing
            mkdir -p probe && cp .varve/varve-realms.toml probe/
            printf 'manifest-version = 1\n[toolchain]\nrealm = "%s"\nchannel = "%s"\nlayer = "%s"\n' "$REALM" "$CHANNEL" "$2" > probe/varve.toml
            ( cd probe && VARVE_ROOT="$RUNNER_TEMP/probe-$1-$RANDOM" "$VARVE" outdated --json 2>/dev/null ) \
              | jq -r 'select(.answerable == true) | .index_counter // empty'
          }
          for FILE in line-index/*.json; do
            LINE="$(basename "$FILE" .json)"
            test "$(jq -r .line "$FILE")" = "$LINE" || { echo "::error::$FILE says line $(jq -r .line "$FILE")"; FAILED=1; continue; }
            WANT=$(jq -r .counter "$FILE")
            FIRST=$(jq -r '.layers[0].layer' "$FILE")
            GOT=""
            if grep -qx "line-index-$LINE" tags.txt; then GOT="$(served "$LINE" "$FIRST")"; fi
            if [ -n "$GOT" ]; then
              oras manifest fetch "$REPO:line-index-$LINE" > im.json
              oras blob fetch --output published-index.dsse "$REPO@$(jq -r '.layers[0].digest' im.json)"
              jq -r .payload published-index.dsse | base64 -d > published-index.json
              if [ "$GOT" = "$WANT" ] && [ "$(jq -S . published-index.json)" = "$(jq -S . "$FILE")" ]; then
                echo "::notice::$LINE: the registry already serves index #$WANT"; continue
              fi
              if [ "$GOT" -ge "$WANT" ]; then
                echo "::error::$LINE: the registry serves a verified index #$GOT that is not this repository's #$WANT — published out of band; bring the repository up to date rather than roll it back"
                FAILED=1; continue
              fi
            else
              echo "::notice::$LINE: no verified index served — publishing"
            fi

            "$VARVE" sign-index --file "$FILE" \
              --key <(printf '%s' "$VARVE_COVALENT_KEY") --key-id covalent-1 \
              --out line-index.dsse.json
            oras blob push "$REPO" line-index.dsse.json
            jq -n \
              --arg d "sha256:$(sha256sum line-index.dsse.json | cut -d' ' -f1)" \
              --argjson s "$(wc -c < line-index.dsse.json)" \
              '{
                schemaVersion: 2,
                mediaType: "application/vnd.oci.image.manifest.v1+json",
                artifactType: "application/vnd.pulseengine.varve.line-index.v1+json",
                config: { mediaType: "application/vnd.oci.empty.v1+json",
                          digest: "sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a",
                          size: 2 },
                layers: [ { mediaType: "application/json", digest: $d, size: $s,
                            annotations: {"eu.pulseengine.varve.role": "line-index"} } ]
              }' > line-index-manifest.json
            oras manifest push "$REPO:line-index-$LINE" line-index-manifest.json

            # Publishing is not the claim; a consumer reading it is.
            GOT="$(served "$LINE" "$FIRST")"
            if [ "$GOT" = "$WANT" ]; then
              echo "::notice::$LINE: published index #$WANT and varve outdated reads it back verified"
            else
              echo "::error::$LINE: published, but varve outdated does not read back index #$WANT (got '${GOT}')"; FAILED=1
            fi
          done
          exit "$FAILED"
