name: Deposit on merge

# THE OTHER HALF OF "NOTHING MANUAL".
#
# The scanner proposes a pull request and a person merges it. Without this,
# that person would then have to go and press a button to deposit — which is
# the manual step the proposal was supposed to remove, moved rather than
# deleted.
#
# So: merging a change to layer.toml IS the decision to deposit. The layer id
# and counter are derived from the published record, never typed, because a
# layer id once spent cannot be reused — varve has neither revocation nor
# deletion.
on:
  push:
    branches: [main]
    # ONLY layer.toml. The deposit itself commits `line-index/<line>.json` back
    # to main, and a filter that included it would re-trigger this workflow
    # from its own output, forever.
    paths:
      - layer.toml

permissions:
  contents: read
  actions: write

concurrency:
  # One deposit at a time. Two runs for the same layer id would both ask the
  # registry, both be told the id is unpublished, and both push — one id naming
  # two digests, which is the thing the immutability check exists to catch.
  group: deposit-on-merge
  cancel-in-progress: false

jobs:
  deposit:
    name: the merge was the decision; sign it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: what layer id and counter does the published record say
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Derived from the registry, never guessed. Refuses outright if the
          # registry cannot be read or the computed tag already exists.
          OUT="$(tools/next-layer-id.sh)"
          LAYER="$(printf '%s' "$OUT" | cut -f1)"
          COUNTER="$(printf '%s' "$OUT" | cut -f2)"
          test -n "$LAYER" && test -n "$COUNTER" || {
            echo "::error::next-layer-id.sh produced no answer — refusing to deposit"
            exit 1
          }
          echo "layer=$LAYER"     >> "$GITHUB_OUTPUT"
          echo "counter=$COUNTER" >> "$GITHUB_OUTPUT"
          echo "::notice::next layer $LAYER, counter $COUNTER"

      - name: deposit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deposit.yml \
            -f layer="${{ steps.next.outputs.layer }}" \
            -f counter="${{ steps.next.outputs.counter }}"
          echo "::notice::dispatched deposit of ${{ steps.next.outputs.layer }} (counter ${{ steps.next.outputs.counter }})"
